services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  api:
    build: ./fox-api
    environment:
      MONGODB_URI: mongodb://mongo:27017/fox-practice
      JWT_SECRET: practice-compose-secret
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: [mongo]
  client:
    build: ./fox-client
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  mongo-data:
