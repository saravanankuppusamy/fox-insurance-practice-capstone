apiVersion: apps/v1
kind: Deployment
metadata: {name: fox-client, namespace: fox-practice}
spec:
  replicas: 1
  selector: {matchLabels: {app: fox-client}}
  template:
    metadata: {labels: {app: fox-client}}
    spec:
      containers:
      - name: client
        image: fox-practice-client:latest
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: fox-client, namespace: fox-practice}
spec:
  type: NodePort
  selector: {app: fox-client}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
