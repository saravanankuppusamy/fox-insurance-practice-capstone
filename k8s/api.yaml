apiVersion: apps/v1
kind: Deployment
metadata: {name: fox-api, namespace: fox-practice}
spec:
  replicas: 2
  selector: {matchLabels: {app: fox-api}}
  template:
    metadata: {labels: {app: fox-api}}
    spec:
      containers:
      - name: api
        image: fox-practice-api:latest
        imagePullPolicy: Never
        ports: [{containerPort: 4000}]
        env:
        - {name: PORT, value: "4000"}
        - {name: CLIENT_ORIGIN, value: "http://localhost:30080"}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: fox-secrets, key: JWT_SECRET}}
        - name: MONGODB_URI
          valueFrom: {secretKeyRef: {name: fox-secrets, key: MONGODB_URI}}
        readinessProbe: {httpGet: {path: /api/health, port: 4000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: 4000}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: fox-practice}
spec: {selector: {app: fox-api}, ports: [{port: 4000, targetPort: 4000}]}
